# vhost de nginx equivalente al Caddyfile, para usar con docker-compose.nginx.yml.
# Instalación:
#   cp deploy/nginx-whacharjuntos.conf /etc/nginx/sites-available/whacharjuntos
#   (ajustar server_name y root)
#   ln -s ../sites-available/whacharjuntos /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d watchando.blucaro.site
#
# Los map van a nivel http (sites-enabled se incluye ahí). Se usan para no
# poner add_header dentro de los location: en nginx eso borra los heredados.

# Captura de pantalla solo en /transmitir; el viewer es de solo lectura.
map $uri $whacharjuntos_pp {
    ~^/transmitir(/|$)  "camera=(), microphone=(), display-capture=(self), geolocation=()";
    default             "camera=(), microphone=(), display-capture=(), geolocation=()";
}

# Revalidar siempre los estáticos; HLS/WHEP mandan sus propios headers.
map $uri $whacharjuntos_cache {
    ~^/[A-Za-z0-9_-]+/(whip|whep)(/[^/]+)?$       "";
    ~^/[A-Za-z0-9_-]+/[^/]+\.(m3u8|mp4|mp|ts)$    "";
    default                                         "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name watchando.blucaro.site;
    root /var/www/whacharjuntos/web;
    index index.html;

    # Como en Caddy: sin access logs.
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy $whacharjuntos_pp always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control $whacharjuntos_cache;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Señalización WebRTC (WHIP/WHEP) -> MediaMTX :8889. El media va por UDP 8189.
    location ~ ^/[A-Za-z0-9_-]+/(whip|whep)(/[^/]+)?$ {
        proxy_pass http://127.0.0.1:8889;
    }

    # LL-HLS -> MediaMTX :8888. Playlists bloqueantes: sin buffering.
    location ~ ^/[A-Za-z0-9_-]+/[^/]+\.(m3u8|mp4|mp|ts)$ {
        proxy_pass http://127.0.0.1:8888;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # hls.js embebido en MediaMTX.
    location = /_lib/hls.min.js {
        proxy_pass http://127.0.0.1:8888;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
