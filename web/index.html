<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>whacharjuntos</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="player" class="player show-ui logged-out">
    <video id="video" playsinline autoplay muted disablepictureinpicture></video>

    <div id="overlay" class="overlay" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="overlay-title" class="overlay-title">Conectando…</p>
      <p id="overlay-detail" class="overlay-detail"></p>
    </div>

    <button id="unmute" class="unmute" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      Activar sonido
    </button>

    <div id="controls" class="controls">
      <span id="status" class="status" data-state="connecting">conectando</span>

      <button id="btn-mute" class="icon-btn" type="button" aria-label="Activar sonido" title="Sonido (m)">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>
      </button>
      <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volumen">

      <span class="spacer"></span>

      <div class="mode" role="group" aria-label="Protocolo">
        <button type="button" data-mode="whep" title="WebRTC: sub-segundo">WebRTC</button>
        <button type="button" data-mode="hls" title="LL-HLS: más latencia, más estable">LL-HLS</button>
      </div>

      <button id="btn-stats" class="icon-btn" type="button" aria-label="Estadísticas" title="Estadísticas (s)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h3V10H4v10zm6.5 0h3V4h-3v16zM17 20h3v-7h-3v7z"/></svg>
      </button>
      <button id="btn-logout" class="icon-btn" type="button" aria-label="Salir" title="Salir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17v-3H3v-4h7V7l5 5-5 5zm4-14h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5v-2h5V5h-5V3z"/></svg>
      </button>
      <button id="btn-fullscreen" class="icon-btn" type="button" aria-label="Pantalla completa" title="Pantalla completa (f)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h5V3H3v7h2V5zm9-2v2h5v5h2V3h-7zm5 16h-5v2h7v-7h-2v5zM5 14H3v7h7v-2H5v-5z"/></svg>
      </button>
    </div>

    <form id="login" class="login" hidden>
      <h1 class="login-title">whacharjuntos</h1>
      <label id="login-room-field" class="field">
        <span>Sala</span>
        <input id="login-room" name="room" autocomplete="off" autocapitalize="none" spellcheck="false"
               pattern="[A-Za-z0-9_\-]{1,64}" maxlength="64">
      </label>
      <label class="field">
        <span>Usuario</span>
        <input id="login-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="remember">
        <input id="login-remember" type="checkbox" checked>
        <span>Recordarme en este dispositivo</span>
      </label>
      <p id="login-error" class="login-error" role="alert"></p>
      <button class="login-submit" type="submit">Entrar</button>
    </form>

    <aside id="stats" class="stats" hidden aria-label="Estadísticas">
      <dl>
        <dt>protocolo</dt><dd data-k="proto">—</dd>
        <dt>bitrate</dt><dd data-k="bitrate">—</dd>
        <dt>resolución</dt><dd data-k="resolution">—</dd>
        <dt>fps</dt><dd data-k="fps">—</dd>
        <dt>frames perdidos</dt><dd data-k="dropped">—</dd>
        <dt>paquetes perdidos</dt><dd data-k="lost">—</dd>
        <dt>RTT</dt><dd data-k="rtt">—</dd>
        <dt>jitter</dt><dd data-k="jitter">—</dd>
        <dt>latencia</dt><dd data-k="latency">—</dd>
      </dl>
    </aside>
  </main>
</body>
</html>
